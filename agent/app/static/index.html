<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechCorp Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef1f4; --surface:#fff; --ink:#16202a; --muted:#63748a;
    --line:#dbe1e8; --accent:#1f5fa8; --accent-soft:#e7effa;
    --tool-bg:#fdf3d8; --tool-ink:#7a5a12; --tool-line:#e6d5a3;
    --warn:#b03636;
    --sans:"IBM Plex Sans Thai",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.65;
    display:flex; justify-content:center;
  }
  .app{
    width:100%; max-width:760px; height:100dvh;
    display:grid; grid-template-rows:auto 1fr auto;
    background:var(--surface); border-inline:1px solid var(--line);
  }

  /* ---------- header ---------- */
  header{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  h1{
    font-size:15px; font-weight:600; margin:0; letter-spacing:-.01em;
  }
  .meta{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    margin-inline-start:auto; display:flex; gap:14px; align-items:center;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#c3ccd6;display:inline-block;margin-inline-end:5px}
  .dot.ok{background:#2f9e5f}
  .dot.bad{background:var(--warn)}
  select{
    font-family:var(--mono); font-size:11px; color:var(--ink);
    border:1px solid var(--line); background:var(--surface);
    border-radius:5px; padding:3px 5px;
  }

  /* ---------- messages ---------- */
  main{overflow-y:auto; padding:22px 20px 8px; scroll-behavior:smooth}
  .turn{margin-bottom:26px}
  .who{
    font-family:var(--mono); font-size:10px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  .bubble{white-space:pre-wrap; overflow-wrap:anywhere}
  .turn.me .bubble{
    background:var(--accent-soft); border-inline-start:2px solid var(--accent);
    padding:9px 13px; border-radius:0 7px 7px 0;
  }

  /* ---------- tool trace (signature) ---------- */
  .trace{
    margin:0 0 12px; padding-inline-start:13px;
    border-inline-start:1px dashed var(--tool-line);
  }
  .step{
    display:flex; align-items:baseline; gap:8px;
    font-family:var(--mono); font-size:11.5px; color:var(--tool-ink);
    padding:2px 0;
  }
  .step::before{
    content:""; width:5px; height:5px; flex:none; border-radius:1px;
    background:var(--tool-line); margin-inline-start:-16px;
  }
  .step .n{color:var(--muted); min-width:14px}
  .step .name{background:var(--tool-bg); padding:1px 6px; border-radius:4px}

  .sources{
    margin-top:10px; padding-top:9px; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--muted);
  }
  .sources b{font-family:var(--mono); font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; font-weight:500; display:block; margin-bottom:4px}
  .sources div{padding:1px 0}
  .sources code{font-family:var(--mono); font-size:11px; color:var(--ink)}

  .thinking{color:var(--muted); font-size:13px}
  .thinking i{
    display:inline-block; width:4px; height:4px; border-radius:50%;
    background:var(--muted); margin-inline-end:3px; animation:blink 1.2s infinite;
  }
  .thinking i:nth-child(2){animation-delay:.2s}
  .thinking i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}}

  .error{color:var(--warn); font-size:13px}

  /* ---------- empty state ---------- */
  .empty{color:var(--muted); font-size:13.5px; padding:6px 0 2px}
  .empty p{margin:0 0 12px}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{
    font-size:13px; font-family:var(--sans); color:var(--ink);
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:5px 12px; cursor:pointer;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}

  /* ---------- composer ---------- */
  footer{border-top:1px solid var(--line); padding:12px 20px 16px}
  form{display:flex; gap:9px; align-items:flex-end}
  textarea{
    flex:1; resize:none; font:inherit; color:inherit;
    border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; max-height:150px; background:var(--surface);
  }
  textarea:focus-visible, button:focus-visible, .chip:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  button{
    font:inherit; font-weight:500; color:#fff; background:var(--ink);
    border:0; border-radius:8px; padding:9px 17px; cursor:pointer;
  }
  button:disabled{background:#aab4c0; cursor:not-allowed}
  .hint{
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    margin-top:7px; display:flex; justify-content:space-between;
  }
  .hint a{color:inherit}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>TechCorp Helpdesk</h1>
    <label class="meta" style="margin:0">
      <select id="emp">
        <option>EMP-1234</option><option>EMP-2345</option>
        <option>EMP-3456</option><option>EMP-4567</option><option>EMP-5678</option>
      </select>
    </label>
    <span class="meta">
      <span><span class="dot" id="dot"></span><span id="kb">กำลังเชื่อมต่อ</span></span>
      <span id="sid">—</span>
    </span>
  </header>

  <main id="log">
    <div class="empty" id="empty">
      <p>ถามเรื่องวันลา การเบิกค่าใช้จ่าย IT security สิ่งอำนวยความสะดวกในออฟฟิศ หรือสถานะ ticket ของคุณ</p>
      <div class="chips">
        <button class="chip">ผมเหลือวันลาพักร้อนกี่วัน</button>
        <button class="chip">เบิกค่าแท็กซี่ไปหาลูกค้าได้เท่าไหร่</button>
        <button class="chip">VPN ต่อไม่ได้ทำไงดี</button>
        <button class="chip">อยากลาพักร้อน 5 วัน ต้องขอใครอนุมัติ แล้ววันลาพอมั้ย</button>
      </div>
    </div>
  </main>

  <footer>
    <form id="f">
      <textarea id="q" rows="1" placeholder="พิมพ์คำถาม…" autocomplete="off"></textarea>
      <button id="send" type="submit">ส่ง</button>
    </form>
    <div class="hint">
      <span>Enter ส่ง · Shift+Enter ขึ้นบรรทัดใหม่</span>
      <span>รีเฟรชหน้าเพื่อเริ่มบทสนทนาใหม่</span>
    </div>
  </footer>
</div>

<script>
// รีเฟรชหน้า = session ใหม่ เก็บไว้ในตัวแปรเท่านั้น ไม่เขียนลง storage
const SESSION = (crypto.randomUUID?.() ?? String(Date.now() + Math.random()));
const log = document.getElementById("log");
const empty = document.getElementById("empty");
const q = document.getElementById("q");
const send = document.getElementById("send");
document.getElementById("sid").textContent = SESSION.slice(0, 8);

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const scroll = () => log.scrollTo({ top: log.scrollHeight, behavior: "smooth" });

function addTurn(who, label) {
  const t = el("div", "turn " + who);
  t.append(el("div", "who", label));
  log.append(t);
  return t;
}

async function health() {
  const dot = document.getElementById("dot");
  const kb = document.getElementById("kb");
  try {
    const r = await fetch("/health");
    const d = await r.json();
    dot.className = "dot " + (d.chunks > 0 ? "ok" : "bad");
    kb.textContent = d.chunks > 0 ? d.chunks + " chunks" : "ยังไม่มีข้อมูล";
  } catch {
    dot.className = "dot bad";
    kb.textContent = "เชื่อมต่อไม่ได้";
  }
}
health();

async function ask(text) {
  empty.remove?.();
  const me = addTurn("me", "คุณ");
  me.append(el("div", "bubble", text));

  const bot = addTurn("bot", "helpdesk");
  const wait = el("div", "thinking");
  wait.innerHTML = "<i></i><i></i><i></i> กำลังค้นหา";
  bot.append(wait);
  scroll();

  send.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        employee_id: document.getElementById("emp").value,
        message: text,
        session_id: SESSION,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    wait.remove();

    // ผังเครื่องมือที่ถูกเรียก แสดงก่อนคำตอบเพราะเกิดขึ้นก่อน
    if (d.tools_used?.length) {
      const trace = el("div", "trace");
      d.tools_used.forEach((name, i) => {
        const s = el("div", "step");
        s.append(el("span", "n", String(i + 1)), el("span", "name", name));
        trace.append(s);
      });
      bot.append(trace);
    }

    bot.append(el("div", "bubble", d.reply));

    if (d.sources?.length) {
      const box = el("div", "sources");
      box.append(el("b", null, "อ้างอิง"));
      d.sources.forEach((s) => {
        const row = el("div");
        row.append(el("code", null, s.source), document.createTextNode("  " + s.section_path));
        box.append(row);
      });
      bot.append(box);
    }
  } catch (e) {
    wait.remove();
    bot.append(el("div", "error", "เรียกไม่สำเร็จ: " + e.message + " — ตรวจว่า agent รันอยู่ที่ port 3000"));
  } finally {
    send.disabled = false;
    q.focus();
    scroll();
  }
}

document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || send.disabled) return;
  q.value = "";
  q.style.height = "auto";
  ask(text);
});

q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("f").requestSubmit();
  }
});
q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 150) + "px";
});

document.querySelectorAll(".chip").forEach((c) =>
  c.addEventListener("click", () => ask(c.textContent))
);
q.focus();
</script>
</body>
</html>
